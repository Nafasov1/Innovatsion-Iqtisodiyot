<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 Innovatsion Iqtisodiyot Testi</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
            position: relative;
        }
        
        h1 {
            color: #2d3748;
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .stats-item {
            text-align: center;
            flex: 1;
        }
        
        .stats-label {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        
        .stats-value {
            font-size: 1.3rem;
            font-weight: 800;
        }
        
        .set-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .set-btn {
            padding: 14px 8px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            -webkit-appearance: none;
        }
        
        .set-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .set-btn:active {
            transform: scale(0.98);
        }
        
        .question-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            display: none;
        }
        
        .question-card.active {
            display: block;
            animation: slideIn 0.4s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .options-grid {
            display: grid;
            gap: 12px;
        }
        
        .option {
            padding: 18px 15px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .option:active {
            background: #edf2f7;
            transform: scale(0.99);
        }
        
        .option.correct {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: #059669;
        }
        
        .option.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-color: #dc2626;
        }
        
        .option.disabled {
            pointer-events: none;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }
        
        .control-btn {
            padding: 18px 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            -webkit-appearance: none;
        }
        
        .control-btn:active {
            transform: scale(0.96);
        }
        
        #prev-btn {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        #random-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }
        
        #next-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .action-btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #result-btn {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            display: none;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.3);
        }
        
        #restart-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            display: none;
            margin-top: 15px;
        }
        
        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin: 25px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            animation: feedbackAnimation 1s ease;
        }
        
        @keyframes feedbackAnimation {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -200%) scale(0.8); }
        }
        
        @media (max-width: 380px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            .set-selector {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .control-buttons {
                grid-template-columns: 1fr;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .option {
                padding: 16px 12px;
                font-size: 0.95rem;
            }
        }
        
        /* iPhone uchun maxsus optimizatsiya */
        @supports (-webkit-touch-callout: none) {
            body {
                padding: 10px;
                padding-bottom: 40px;
            }
            
            .container {
                border-radius: 16px;
                padding: 15px;
            }
            
            .option {
                padding: 20px 15px;
            }
            
            .control-btn {
                padding: 20px 15px;
            }
        }
    </style>
</head>

    <button class="action-btn" id="result-btn">📊 Natijani ko'rsatish</button>

</div>

let currentSet = 1;

let correctCount = 0;

const currentEl = document.getElementById('current-question');
const totalEl = document.getElementById('current-question').nextElementSibling; // Progress barda ko'rsatiladi

const restartBtn = document.getElementById('restart-btn');

// Ovoz funksiyasi
function playSound(isCorrect) {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (isCorrect) {
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        } else {
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        }
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
    } catch (e) {
        console.log("Ovoz xatosi:", e);
    }
}

// Feedback animatsiyasi
function showFeedback(isCorrect) {
    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.textContent = isCorrect ? '✅' : '❌';
    feedback.style.color = isCorrect ? '#10b981' : '#ef4444';
    document.body.appendChild(feedback);
    
    setTimeout(() => {
        feedback.remove();
    }, 1000);
}

// Savolni chizish
function renderQuestion(index) {
    wrapper.innerHTML = '';
    currentQuestionIndex = index;
    currentEl.textContent = index + 1;
    
    const question = currentQuestions[index];
    
    const card = document.createElement('div');
    card.className = 'question-card active';
    
    card.innerHTML = `
        <div class="question-number">${index + 1}</div>
        <div class="question-text">${question.q}</div>
        <div class="options-grid" id="options-grid"></div>
    `;
    
    const optionsGrid = card.querySelector('#options-grid');
    const options = [...question.a];
    
    // Javoblarni aralashtirish
    for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
    }
    
    options.forEach((optionText, optionIndex) => {
        const option = document.createElement('div');
        option.className = 'option';
        option.textContent = optionText;
        
        if (answeredQuestions.has(index)) {
            option.classList.add('disabled');
            if (optionText === question.a[question.c]) {
                option.classList.add('correct');
            } else if (answeredQuestions.has(index)) {
                // Xato javobni ko'rsatish
            }
        }
        
        option.addEventListener('click', () => {
            if (answeredQuestions.has(index)) return;
            
            answeredQuestions.add(index);
            option.classList.add('disabled');
            
            const isCorrect = optionText === question.a[question.c];
            
            if (isCorrect) {
                option.classList.add('correct');
                correctCount++;
                correctEl.textContent = correctCount;
                playSound(true);
                showFeedback(true);
            } else {
                option.classList.add('wrong');
                playSound(false);
                showFeedback(false);
                
                // To'g'ri javobni ko'rsatish
                optionsGrid.querySelectorAll('.option').forEach(opt => {
                    if (opt.textContent === question.a[question.c]) {
                        opt.classList.add('correct');
                    }
                });
            }
            
            updateProgress();
            updateNavigation();
            
            // Agar hamma savollarga javob berilsa
            if (answeredQuestions.size === currentQuestions.length) {
                resultBtn.style.display = 'block';
            }
        });
        
        optionsGrid.appendChild(option);
    });
    
    wrapper.appendChild(card);
    updateProgress();
    updateNavigation();
}

// Progress yangilash
function updateProgress() {
    const progress = (answeredQuestions.size / currentQuestions.length) * 100;
    progressFill.style.width = `${progress}%`;
}

// Navigation yangilash
function updateNavigation() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.disabled = currentQuestionIndex === currentQuestions.length - 1;
    
    // Progress bar rangini o'zgartirish
    const progress = (answeredQuestions.size / currentQuestions.length) * 100;
    if (progress >= 70) {
        progressFill.style.background = 'linear-gradient(135deg, #10b981, #059669)';
    } else if (progress >= 40) {
        progressFill.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
    } else {
        progressFill.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
    }
}

// Set tanlash
function selectSet(setNum) {
    currentSet = setNum;
    currentQuestionIndex = 0;
    answeredQuestions.clear();
    correctCount = 0;
    correctEl.textContent = '0';
    
    // Set tugmalarni yangilash
    setButtons.forEach(btn => {
        btn.classList.remove('active');
        if (parseInt(btn.dataset.set) === setNum) {
            btn.classList.add('active');
        }
    });
    
    setNumberEl.textContent = setNum;
    
    // Savollarni tanlash
    const startIndex = (setNum - 1) * 25;
    const endIndex = Math.min(startIndex + 25, testData.length);
    currentQuestions = testData.slice(startIndex, endIndex);
    
    // Natija tugmasini yashirish
    resultBtn.style.display = 'none';
    restartBtn.style.display = 'none';
    
    renderQuestion(currentQuestionIndex);
}

// Random 25 ta savol
function selectRandomSet() {
    currentSet = 0;
    currentQuestionIndex = 0;
    answeredQuestions.clear();
    correctCount = 0;
    correctEl.textContent = '0';
    
    // Set tugmalarni yangilash
    setButtons.forEach(btn => btn.classList.remove('active'));
    
    setNumberEl.textContent = 'R';
    
    // 140 tadan 25 tasini random tanlash
    const shuffled = [...testData].sort(() => Math.random() - 0.5);
    currentQuestions = shuffled.slice(0, 25);
    
    // Natija tugmasini yashirish
    resultBtn.style.display = 'none';
    restartBtn.style.display = 'none';
    
    renderQuestion(currentQuestionIndex);
}

// Natijani ko'rsatish
function showResults() {
    const score = correctCount;
    const total = currentQuestions.length;
    const percentage = Math.round((score / total) * 100);
    
    let message = '';
    let emoji = '';
    
    if (percentage >= 90) {
        message = 'AJOYIB! 👑 Mukammal!';
        emoji = '🎉';
    } else if (percentage >= 70) {
        message = 'YAXSHI! 👍 Juda yaxshi ishladingiz!';
        emoji = '🌟';
    } else if (percentage >= 50) {
        message = 'YOQLI! 💪 Yaxshi natija!';
        emoji = '✅';
    } else {
        message = 'YANA MASHQ QILING 💪 Ko'proq o'rganish kerak';
        emoji = '📚';
    }
    
    wrapper.innerHTML = `
        <div class="question-card active" style="text-align: center;">
            <div class="question-number" style="background: ${percentage >= 70 ? '#10b981' : percentage >= 50 ? '#f59e0b' : '#ef4444'}; margin: 0 auto 20px;">
                ${percentage}%
            </div>
            <div class="question-text" style="font-size: 2rem; margin-bottom: 10px;">
                ${emoji}
            </div>
            <div class="question-text" style="font-size: 1.3rem; color: ${percentage >= 70 ? '#10b981' : percentage >= 50 ? '#f59e0b' : '#ef4444'};">
                ${message}
            </div>
            <div style="font-size: 1.1rem; color: #4a5568; margin: 20px 0;">
                <p>Siz <strong>${total}</strong> ta savoldan <strong style="color: #10b981">${score}</strong> tasiga to'g'ri javob berdingiz</p>
                <p>To'g'ri javoblar: <strong>${percentage}%</strong></p>
            </div>
            <div style="margin-top: 30px;">
                <button class="action-btn" onclick="location.reload()" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                    🔄 Yangi test
                </button>
            </div>
        </div>
    `;
    
    restartBtn.style.display = 'block';
    resultBtn.style.display = 'none';
}

// Event listener'lar
setButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        selectSet(parseInt(btn.dataset.set));
    });
});

prevBtn.addEventListener('click', () => {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion(currentQuestionIndex);
    }
});

nextBtn.addEventListener('click', () => {
    if (currentQuestionIndex < currentQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuestion(currentQuestionIndex);
    }
});

randomBtn.addEventListener('click', selectRandomSet);
resultBtn.addEventListener('click', showResults);

// Boshlang'ich yuklash
selectSet(1);

// iPhone uchun maxsus optimizatsiya
document.addEventListener('touchstart', function() {}, {passive: true});
document.addEventListener('touchmove', function(e) {
    if (e.scale !== 1) { e.preventDefault(); }
}, {passive: false});

// Offline ishlashi uchun
window.addEventListener('load', function() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(error) {
            console.log('ServiceWorker registration failed:', error);
        });
    }
});
</script>
